<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigate</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
        /* Basic reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

        /* App container */
      body,
      html {
        font-family: Arial, sans-serif;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
      }

      .app-container {
        width: 375px;
        height: 667px;
        border: 2px solid #333;
        border-radius: 20px;
        background-color: #e9e9e9;
        overflow: hidden;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        /* This helps positioning within the items within the "phone" */
        position: relative;
      }

      .top-bar {
        height: 100px;
        width: 100%;
        background-color: #34a853;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 18px;
        font-weight: bold;
      }

      .bottom-bar {
        height: 120px;
        width: 100%;
        background-color: #bdbdbd;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 18px;
        font-weight: bold;
        /* This adjusts so the bottom bar is actually on the bottom */
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
      }

    </style>
</head>
<body>
    <!-- Makes phone aspect ratio -->
    <div class="app-container">
        <div class="top-bar">
            <img id="direction-arrow" src="" alt="Direction" style="width: 50px; height: 50px; margin-left: -5px; margin-top: -20px;">
            <span style="margin-left: -40px; margin-bottom: -50px;">0.1 mi</span>
        </div>

        <div class="bottom-bar">
            <img id="exit" src="images/navigate/exit.png" alt="Exit" style="width: 80px; height: 80px; margin-left: -5px;">
            <span style="font-size: 35px; margin-left: 10px; margin-bottom: 50px;">20 mins</span>
            <span style="font-size: 35px; margin-left: 10px; margin-bottom: -50px;">50 miles</span>
        </div>
    </div>
    <script>
        direction_arrows = ["left", "right", "straight", "u_turn"];
        let imagePath = `images/navigate/${direction_arrows[0]}.png`;
        document.getElementById('direction-arrow').src = imagePath;

    </script>
</body>
</html>
